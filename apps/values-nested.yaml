# Nested App-of-Apps for testing the Sync step with a child that is itself a parent (depth 1).
#
#   <this parent>
#   +- example.nested-guestbook                (leaf app)
#   +- example.nested-apps                     (child that is also a parent, rendered with values-nested-child.yaml)
#      +- example.nested-helm-guestbook        (leaf app)
#      +- example.nested-kustomize-guestbook   (leaf app)
#
# Every app has a "nested-" name and the path of the regular example app, so none of them shares an
# Application CR (or a destination namespace) with the apps of values.yaml and both can be installed together.
# Use it as the helm valueFiles of an Application whose source path is "apps".
config:
  applicationNamespace: argocd-1
  project: ac87e41e
  spec:
    destination:
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/argoproj/argocd-example-apps
      targetRevision: master

applications:
  - name: nested-guestbook
    path: guestbook
  - name: nested-apps
    # this chart again, with the child values below, so this child creates its own child apps
    path: apps
    # the Application CRs of the nested level are created in the agent namespace, not in a new one
    destination:
      namespace: argocd-1
    tool:
      helm:
        valueFiles:
          - values-nested-child.yaml
