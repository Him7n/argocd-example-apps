# Values for the nested level of values-nested.yaml. The Application CRs of every level live in the same
# namespace, so each app has a unique "nested-" name and reuses the path of the regular example app.
config:
  applicationNamespace: argocd-1
  project: ac87e41e
  spec:
    destination:
      server: https://kubernetes.default.svc
    source:
      # the nested values files only exist in this fork, and every child inherits this repo
      repoURL: https://github.com/Him7n/argocd-example-apps
      targetRevision: master

applications:
  - name: nested-helm-guestbook
    path: helm-guestbook
    tool:
      helm:
        releaseName: nested-helm-guestbook
  - name: nested-kustomize-guestbook
    path: kustomize-guestbook
