# Small App-of-Apps for testing on a Harness GitOps agent.
# The full upstream list is kept in values-full.yaml.
config:
  # Namespace where the CHILD Application CRs are created. It must be a namespace
  # the agent's application-controller reconciles (the agent namespace), otherwise
  # the children get no status/health.
  applicationNamespace: gitopssanityagent-qa-a2e332dc78
  # AppProject for the children. Must exist and be allowed to use the repo/destination below.
  project: default-donotremovehimanshutest
  spec:
    destination:
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/argoproj/argocd-example-apps
      targetRevision: master

applications:
  - name: guestbook
  - name: helm-guestbook
    tool:
      helm:
        releaseName: helm-guestbook
  - name: kustomize-guestbook
